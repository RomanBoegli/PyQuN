[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyqun"
version = "1.0.0"
description = "RaQuN Lab: the RaQuN n-way model matching algorithm and a lab for benchmarking model matching strategies"
readme = "readme.md"
requires-python = ">=3.12"
keywords = ["model matching", "n-way matching", "RaQuN"]
# The core (data model, RaQuN, candidate search, matching) needs only these; scipy comes with scikit-learn
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3.1",
]

[project.optional-dependencies]
# Plots and result tables (RaQuN_Lab.evaluation.XYPlot, RaQuN_Lab.evaluation.ResultView)
evaluation = ["matplotlib>=3.8", "tabulate>=0.9"]
# Locality-sensitive hashing KNN (RaQuN_Lab.strategies.RaQuN.candidatesearch.NNCandidateSearch.knn.LSHKNN)
lsh = ["nearpy>=1.0"]
# Experiment configs in YAML (RaQuN_Lab.utils.YamlParser)
yaml = ["pyyaml>=6.0"]

[project.urls]
Repository = "https://github.com/RomanBoegli/PyQuN"
Upstream = "https://github.com/JohansonB/PyQuN"
Paper = "https://doi.org/10.1007/s10270-022-01062-5"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["RaQuN_Lab"]

[tool.hatch.build.targets.sdist]
include = ["/RaQuN_Lab", "/tests", "/readme.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
